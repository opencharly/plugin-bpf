version: 2026.240.1943
plugin-bpf:
    candy:
        version: 2026.243.0001
        description: |-
            OUT-OF-TREE GENERIC charly BPF/eBPF kernel plugin — the one canonical surface for
            BPF kernel-feature readiness on any venue (bare host or VM guest): command:bpf
            (status | lsm | config | probe) plus the verb:bpf declarative check steps any
            candy can bake into its plan. Reads the kernel state directly and READ-ONLY:
            /sys/kernel/security/lsm (the BPF-LSM gate cardwire-class tools need),
            /sys/kernel/btf/vmlinux, CONFIG_BPF_LSM/CONFIG_DEBUG_INFO_BTF, the BPF sysctl
            knobs, memlock and lockdown. Read-only by default; `probe` is a verify-only
            attach-requirements report (a real transient attach probe requires an explicit
            --attach flag + root + bpftool). Dual-class (plugin-mcp precedent): command:bpf
            is CLI-dispatched (charly fork/execs the binary), verb:bpf is served over gRPC
            with a self-contained #BpfInput schema. First consumer: plugin-cardwire's status
            gates on the same BPF-LSM facts (R3: one canonical surface, no ad-hoc copies).
        plugin:
            source: github.com/opencharly/plugin-bpf/candy/plugin-bpf
            providers:
                - command:bpf
                - verb:bpf
            primary:
                bpf: lsm
        plan:
            - check: the bpf plugin ships a buildable Go module the host can build + fork/exec (CLI) and compile in (verb); the deterministic end-to-end (bpf status / bpf lsm exit-code contracts) is exercised by the check-bpf-local bed in opencharly/charly
              id: bpf-module-present
              context:
                - build
              command: "true"

bpf-skill:
    skill:
        name: bpf
        family: bpf
        owner: plugin-bpf
        description: |-
            The `charly bpf` eBPF kernel-feature readiness surface — status, lsm, config, probe.
            Read-only host/kernel inspection before running BPF-LSM-gated tooling (e.g. cardwire).
        triggers:
            - "`charly bpf` / eBPF readiness / BPF-LSM / kernel BPF config"
        content: |
            # charly bpf — BPF/eBPF kernel-feature readiness

            `charly bpf` is the one canonical surface for BPF kernel-feature readiness on any
            venue (bare host or VM guest). It is served by `candy/plugin-bpf` (a `command:bpf`
            + `verb:bpf` plugin).

            ## Command tree

            - `charly bpf status` — the kernel BPF readiness report.
            - `charly bpf lsm` — the active LSM list (the BPF-LSM gate BPF-LSM-gated tools need),
              read from `/sys/kernel/security/lsm`.
            - `charly bpf config` — the kernel config facts (`CONFIG_BPF_LSM`,
              `CONFIG_DEBUG_INFO_BTF`), BTF availability, the BPF sysctl knobs, memlock, lockdown.
            - `charly bpf probe` — a verify-only attach-requirements report. A real transient
              attach probe requires an explicit `--attach` flag + root + bpftool.

            All reads are READ-ONLY and direct — no shelling out. The plugin also serves the
            declarative `bpf:` check verb for candy plans.

            ## When to use it

            Before running BPF-LSM-gated tooling (e.g. cardwire) to confirm the kernel supports
            it, or when diagnosing why a BPF program cannot attach.

            ## Cross-References

            - `/charly-cardwire:cardwire` — the cardwire GPU-manager surface (same LSM reads).
            - `/charly-internals:plugin` — the command/verb plugin class.
